# =============================================
# SERVER
# =============================================
server.port=8080
server.servlet.context-path=/api

# =============================================
# H2 - BANCO EM MEMÓRIA (mais estável para dev)
# =============================================
spring.datasource.url=jdbc:h2:mem:imunidatadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================
# H2 CONSOLE (acesse em http://localhost:8080/api/h2-console)
# JDBC URL para usar no console: jdbc:h2:mem:imunidatadb
# =============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# =============================================
# MULTIPART (upload de CSV)
# =============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =============================================
# JACKSON
# =============================================
spring.jackson.serialization.fail-on-empty-beans=false

# =============================================
# LOGGING
# =============================================
logging.level.root=WARN
logging.level.com.imunidata=INFO
logging.level.org.springframework.web=INFO
